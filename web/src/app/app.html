<header class="app-header">
  <h1>Seguimiento de pacientes</h1>
  <p>Registro de pacientes y de sus contactos por parte del gestor.</p>
</header>

<main>
  <div class="grid">
    <section class="panel">
      <h2>Registrar paciente</h2>
      <app-patient-form (registered)="onPatientRegistered()" />
    </section>

    <section class="panel">
      <h2>Registrar contacto</h2>
      @if (selectedPatient(); as patient) {
        <app-contact-form
          [patient]="patient"
          (registered)="onContactRegistered()"
          (cancelled)="selectedPatient.set(null)"
        />
      } @else {
        <p class="muted">Elija un paciente en la tabla y pulse «Registrar contacto».</p>
      }
    </section>
  </div>

  <section class="panel">
    <h2>Pacientes</h2>
    <app-patient-table (contactRequested)="selectedPatient.set($event)" />
  </section>
</main>
